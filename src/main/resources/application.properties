spring.application.name=demo

# ------------------------------------------------------------------
# Banco de dados H2 em memoria
# Console web: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:barbearia
#   usuario:  sa
#   senha:    (vazio)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:barbearia;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------
# Thymeleaf (cache desligado em desenvolvimento)
# ------------------------------------------------------------------
spring.thymeleaf.cache=false
