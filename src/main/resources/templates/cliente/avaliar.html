<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avaliar atendimento</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="bg-dark-900">
<nav class="navbar navbar-dark bg-dark-blue">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">✂️ Barbearia</a>
    </div>
</nav>

<main class="container py-5">
    <div class="card card-glass border-0 shadow-lg mx-auto" style="max-width: 560px;">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Avaliar atendimento</h2>

            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <p class="mb-1"><strong>Barbeiro:</strong> <span th:text="${agendamento.barbeiro.nome}"></span></p>
            <p class="mb-1"><strong>Serviço:</strong> <span th:text="${agendamento.servico.nome}"></span></p>
            <p class="mb-3"><strong>Data:</strong>
                <span th:text="${#temporals.format(agendamento.dataHora, 'dd/MM/yyyy HH:mm')}"></span></p>

            <form th:action="@{/avaliar}" method="post">
                <input type="hidden" name="agendamentoId" th:value="${agendamento.id}" />

                <div class="mb-3">
                    <label class="form-label" for="nota">Nota</label>
                    <select class="form-select" id="nota" name="nota" required>
                        <option value="5">5 - Excelente</option>
                        <option value="4">4 - Muito bom</option>
                        <option value="3">3 - Bom</option>
                        <option value="2">2 - Ruim</option>
                        <option value="1">1 - Péssimo</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="comentario">Comentário (opcional)</label>
                    <textarea class="form-control" id="comentario" name="comentario" rows="3"
                              maxlength="1000" placeholder="Conte como foi o atendimento..."></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <button class="btn btn-accent" type="submit">Enviar avaliação</button>
                    <a class="btn btn-outline-light"
                       th:href="@{/cliente/status(codigo=${agendamento.codigo})}">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout/fragments/footer :: footer}"></footer>
</body>
</html>
