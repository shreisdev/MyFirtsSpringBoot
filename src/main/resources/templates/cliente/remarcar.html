<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remarcar Agendamento</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<body class="bg-dark-900">
<nav class="navbar navbar-dark bg-dark-blue">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">✂️ Barbearia</a>
    </div>
</nav>
<main class="container py-5">
    <div class="card card-glass border-0 shadow-lg mx-auto" style="max-width: 500px;">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Remarcar Agendamento</h2>
            <p>Selecione uma nova data e horário para o seu agendamento.</p>
            <form th:action="@{/cliente/remarcar}" method="post">
                <input type="hidden" name="agendamentoId" th:value="${agendamentoId}" />
                <div class="mb-3">
                    <label for="novaDataHora" class="form-label">Nova Data e Horário</label>
                    <input type="datetime-local" class="form-control" id="novaDataHora" name="novaDataHora" required />
                </div>
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Remarcar</button>
                    <a th:href="@{/cliente/status}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{layout/fragments/footer :: footer}"></footer>
</body>
</html>
