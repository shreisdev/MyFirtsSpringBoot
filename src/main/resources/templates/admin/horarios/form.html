<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo horário de trabalho</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="bg-dark-900">
<nav th:replace="~{layout/fragments/admin-nav :: adminNav}"></nav>

<main class="container py-5">
    <div class="card card-glass border-0 shadow-lg mx-auto" style="max-width: 620px;">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Novo horário de trabalho</h2>

            <form th:action="@{/admin/horarios}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="barbeiroId">Barbeiro</label>
                    <select class="form-select" id="barbeiroId" name="barbeiroId" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option th:each="b : ${barbeiros}" th:value="${b.id}" th:text="${b.nome}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="diaSemana">Dia da semana</label>
                    <select class="form-select" id="diaSemana" name="diaSemana" required>
                        <option value="1">Segunda-feira</option>
                        <option value="2">Terça-feira</option>
                        <option value="3">Quarta-feira</option>
                        <option value="4">Quinta-feira</option>
                        <option value="5">Sexta-feira</option>
                        <option value="6">Sábado</option>
                        <option value="7">Domingo</option>
                    </select>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="horaInicio">Início</label>
                        <input class="form-control" id="horaInicio" name="horaInicio" type="time" value="09:00" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="horaFim">Fim</label>
                        <input class="form-control" id="horaFim" name="horaFim" type="time" value="18:00" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="inicioAlmoco">Início do almoço (opcional)</label>
                        <input class="form-control" id="inicioAlmoco" name="inicioAlmoco" type="time" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="fimAlmoco">Fim do almoço (opcional)</label>
                        <input class="form-control" id="fimAlmoco" name="fimAlmoco" type="time" />
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-accent" type="submit">Salvar</button>
                    <a class="btn btn-outline-light" th:href="@{/admin/horarios}">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout/fragments/footer :: footer}"></footer>
</body>
</html>
