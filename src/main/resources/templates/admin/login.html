<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
    <main>
        <h1>Login administrativo</h1>
    </main>
    <body class="bg-dark-900">
    <nav class="navbar navbar-dark bg-dark-blue">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">✂️ Barbearia</a>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-glass border-0 shadow-lg">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-3">Login Administrativo</h2>
                        <form th:action="@{/admin/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuário</label>
                                <input type="text" class="form-control" id="username" name="username" required />
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" name="password" required />
                            </div>
                            <button type="submit" class="btn btn-primary">Entrar</button>
                            <div class="text-muted small mt-3">
                                <p>Usuário padrão: <strong>admin</strong></p>
                                <p>Senha padrão: <strong>admin</strong></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
</body>
</html>
